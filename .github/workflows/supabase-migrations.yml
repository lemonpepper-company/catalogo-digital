name: Deploy Supabase Migrations

# Aplica as migrations do Supabase no banco remoto após o merge na main.
# O deploy do app (Vercel) é independente: este workflow cuida apenas do schema.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Permite re-rodar manualmente (recuperação de incidente, ou reaplicar uma
  # migration cujo arquivo não mudou desde a última tentativa) sem precisar de
  # um novo push tocando supabase/migrations/**.
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      # --include-all: com múltiplas branches em paralelo, o timestamp de um
      # arquivo de migration reflete quando foi escrito, não a ordem em que a
      # branch acaba mergeando/deployando. Sem a flag, `supabase db push`
      # recusa aplicar qualquer migration cujo timestamp seja anterior ao
      # último já registrado no banco remoto ("Found local migration files to
      # be inserted before the last migration on remote database") — e falha
      # a run INTEIRA sem aplicar nada, mesmo as migrations mais novas que não
      # têm esse problema. Foi exatamente isso que quebrou o deploy de
      # 2026-07-29: as migrations de domínio próprio (20260725*) chegaram à
      # main depois das migrations de captura de pedidos (20260727*/20260728*)
      # já aplicadas, e a run falhou sem aplicar nenhuma das 6 migrations
      # novas — enquanto o app (deploy separado, via Vercel) já esperava o
      # schema novo, causando tela em branco no /painel.
      - name: Push migrations
        run: supabase db push --include-all
