name: Validate Supabase Migrations

# Guard de PR: sobe um Supabase local do zero e aplica todas as migrations.
# Se alguma migration tiver SQL inválido ou ordem errada, o `supabase start`
# falha e o PR fica vermelho — pegamos o erro antes do merge na main.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      # O próprio workflow entra na lista: sem isso, um PR que só mexe nestes
      # guards não os executa, e a mudança vai para a main sem nunca ter rodado.
      - '.github/workflows/supabase-migrations-check.yml'

jobs:
  # Guard rápido (sem Docker): pega os dois erros de timestamp que já quebraram
  # deploy neste projeto, antes de gastar 2 minutos subindo o Supabase.
  #
  # 1. Colisão: dois arquivos com o mesmo `version`. `schema_migrations.version`
  #    é chave primária, então o segundo insert falha e o `supabase start`/`db
  #    push` morre no meio. Aconteceu em 2026-07-29 entre a migration de
  #    domínio próprio e a de captura de pedidos, ambas 20260728100000.
  #
  # 2. Ordem invertida: migration nova com timestamp ANTERIOR a alguma já
  #    presente na base. Em banco novo isso passa (o CI aplica em ordem de
  #    timestamp), mas em produção o `db push` aplica em ordem de MERGE e
  #    recusava a run inteira sem aplicar nada — enquanto a Vercel já tinha
  #    subido o app esperando o schema novo. Mitigado com `--include-all` no
  #    deploy, mas a divergência entre "ordem do CI" e "ordem de produção"
  #    continua: só some se toda migration nova for a mais recente de todas.
  timestamps:
    name: Migration timestamps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for duplicate and out-of-order versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE_REF"

          versions_in_tree() {
            find supabase/migrations -maxdepth 1 -name '*.sql' -exec basename {} \; \
              | sed 's/_.*//' | sort
          }
          versions_in_base() {
            git ls-tree -r --name-only "origin/$BASE_REF" -- supabase/migrations/ \
              | grep '\.sql$' | xargs -r -n1 basename | sed 's/_.*//' | sort
          }

          duplicadas=$(versions_in_tree | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Duas migrations com o mesmo version: $(echo "$duplicadas" | tr '\n' ' ')"
            echo "schema_migrations.version é chave primária — renomeie uma delas para um timestamp livre."
            exit 1
          fi

          base=$(versions_in_base)
          if [ -z "$base" ]; then
            echo "Base $BASE_REF sem migrations — nada a comparar."
            exit 0
          fi

          maior_da_base=$(echo "$base" | tail -1)
          novas=$(comm -13 <(echo "$base") <(versions_in_tree) || true)

          if [ -z "$novas" ]; then
            echo "Nenhuma migration nova neste PR (a mais recente da base é $maior_da_base)."
            exit 0
          fi

          fora_de_ordem=""
          for v in $novas; do
            # Comparação numérica, não de string: `[ a \< b ]` não é portável
            # (falha no zsh) e string compare só coincide com ordem numérica
            # enquanto todos os versions tiverem o mesmo número de dígitos.
            if [ "$v" -le "$maior_da_base" ]; then
              fora_de_ordem="$fora_de_ordem $v"
            fi
          done

          if [ -n "$fora_de_ordem" ]; then
            echo "::error::Migration nova com timestamp anterior ao da base:$fora_de_ordem"
            echo "A mais recente em $BASE_REF é $maior_da_base — renomeie a sua para um timestamp maior."
            exit 1
          fi

          echo "OK: novas =$(echo "$novas" | tr '\n' ' ')| todas depois de $maior_da_base, sem duplicata."

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies all migrations to a fresh local DB)
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --level warning

      # Guard de privilégios (o único lugar do projeto com banco de verdade):
      # a suíte de testes mocka o client do Supabase, então um GRANT faltando
      # passa despercebido — foi assim que a captura de pedidos nasceu quebrada
      # (`permission denied for table stores` com 500 testes verdes).
      # Roda o psql de dentro do container do banco para não depender de
      # postgresql-client no runner. `do $$ ... raise exception` faz o passo
      # falhar com exit != 0.
      - name: Check table privileges (orders/order_items, catalog_events)
        run: |
          docker exec -i supabase_db_catalogo-digital \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            faltando text;
            vazando  text;
          begin
            -- service_role precisa de exatamente o que app/actions/pedidos.ts usa
            select string_agg(format('%s:%s', req.tbl, req.priv), ', ' order by req.tbl, req.priv)
              into faltando
              from (values
                ('public.orders', 'select'),      -- contagem anti-abuso + id inserido
                ('public.orders', 'insert'),      -- upsert do pedido
                ('public.orders', 'delete'),      -- rollback do pedido órfão
                ('public.order_items', 'select'),
                ('public.order_items', 'insert'),
                ('public.stores', 'select'),      -- lookup da loja por slug
                ('public.products', 'select')     -- preço e nome do produto
              ) as req(tbl, priv)
             where not has_table_privilege('service_role', req.tbl, req.priv);

            if faltando is not null then
              raise exception 'service_role sem privilegio necessario: %', faltando;
            end if;

            -- anon não pode ter NENHUM privilégio em orders/order_items (ORD-24),
            -- nem de tabela nem POR COLUNA. A checagem é coluna a coluna de
            -- propósito: `has_table_privilege` devolve false quando existe apenas
            -- `grant select (coluna) to anon`, e esse é exatamente o padrão que
            -- AGENTS.md ensina para colunas públicas de `stores` — aplicá-lo por
            -- analogia a `orders` abriria o histórico sem este guard reclamar.
            -- (Ponto cego encontrado pela validação do ciclo 2.)
            select string_agg(
                     format('%s.%s:%s', c.table_name, c.column_name, p.priv),
                     ', ' order by c.table_name, c.column_name, p.priv)
              into vazando
              from information_schema.columns c
              cross join (values ('select'), ('insert'), ('update'), ('references')) as p(priv)
             where c.table_schema = 'public'
               and c.table_name in ('orders', 'order_items')
               and has_column_privilege('anon',
                     format('public.%I', c.table_name), c.column_name, p.priv);

            if vazando is not null then
              raise exception 'anon com privilegio de coluna em orders/order_items: %', vazando;
            end if;

            -- Privilégios que não existem por coluna (delete/truncate/trigger/maintain)
            -- continuam checados no nível da tabela.
            select string_agg(format('%s:%s', t.tbl, p.priv), ', ' order by t.tbl, p.priv)
              into vazando
              from (values ('public.orders'), ('public.order_items')) as t(tbl),
                   (values ('delete'), ('truncate'), ('trigger'), ('maintain')) as p(priv)
             where has_table_privilege('anon', t.tbl, p.priv);

            if vazando is not null then
              raise exception 'anon com privilegio de tabela em orders/order_items: %', vazando;
            end if;

            raise notice 'grants ok: service_role com DML na captura, anon sem nada (tabela e coluna)';
          end $$;

          -- Mesmo guard para o analytics nativo (catalog_events + funções de
          -- leitura). Duas armadilhas distintas cobertas aqui:
          --   1. tabela nova não herda DML para service_role (default ACL Dxtm) —
          --      sem o grant a Server Action registrarEvento morre em produção
          --      com a suíte verde, exatamente como aconteceu com orders;
          --   2. função nova herda EXECUTE para PUBLIC — sem o revoke o anon
          --      poderia invocar a RPC de métricas de qualquer loja.
          do $$
          declare
            faltando text;
            vazando  text;
          begin
            -- service_role precisa de select + insert para gravar o evento.
            select string_agg(format('%s:%s', req.tbl, req.priv), ', ' order by req.tbl, req.priv)
              into faltando
              from (values
                ('public.catalog_events', 'select'),
                ('public.catalog_events', 'insert')
              ) as req(tbl, priv)
             where not has_table_privilege('service_role', req.tbl, req.priv);

            if faltando is not null then
              raise exception 'service_role sem privilegio necessario: %', faltando;
            end if;

            -- anon não pode ter NENHUM privilégio em catalog_events (ANL-10/11),
            -- nem de tabela nem por coluna (mesmo ponto cego de orders).
            select string_agg(
                     format('%s.%s:%s', c.table_name, c.column_name, p.priv),
                     ', ' order by c.table_name, c.column_name, p.priv)
              into vazando
              from information_schema.columns c
              cross join (values ('select'), ('insert'), ('update'), ('references')) as p(priv)
             where c.table_schema = 'public'
               and c.table_name = 'catalog_events'
               and has_column_privilege('anon',
                     format('public.%I', c.table_name), c.column_name, p.priv);

            if vazando is not null then
              raise exception 'anon com privilegio de coluna em catalog_events: %', vazando;
            end if;

            select string_agg(format('catalog_events:%s', p.priv), ', ' order by p.priv)
              into vazando
              from (values ('delete'), ('truncate'), ('trigger'), ('maintain')) as p(priv)
             where has_table_privilege('anon', 'public.catalog_events', p.priv);

            if vazando is not null then
              raise exception 'anon com privilegio de tabela em catalog_events: %', vazando;
            end if;

            -- Funções de leitura: anon (e PUBLIC, de quem anon herda) sem EXECUTE.
            select string_agg(f.sig, ', ' order by f.sig)
              into vazando
              from (values
                ('public.get_catalog_metrics(uuid,timestamptz,timestamptz)'),
                ('public.get_top_viewed_products(uuid,timestamptz,timestamptz,integer)')
              ) as f(sig)
             where has_function_privilege('anon', f.sig, 'execute');

            if vazando is not null then
              raise exception 'anon com EXECUTE nas funcoes de metricas: %', vazando;
            end if;

            -- E o lojista autenticado precisa conseguir executá-las (a RLS da
            -- tabela é que limita o resultado à própria loja).
            select string_agg(f.sig, ', ' order by f.sig)
              into faltando
              from (values
                ('public.get_catalog_metrics(uuid,timestamptz,timestamptz)'),
                ('public.get_top_viewed_products(uuid,timestamptz,timestamptz,integer)')
              ) as f(sig)
             where not has_function_privilege('authenticated', f.sig, 'execute');

            if faltando is not null then
              raise exception 'authenticated sem EXECUTE nas funcoes de metricas: %', faltando;
            end if;

            raise notice 'grants ok: service_role grava catalog_events, anon sem nada (tabela, coluna e funcoes)';
          end $$;

          -- Mesmo guard para as colunas de assinatura em stores
          -- (20260801000000_subscription_columns.sql). O ponto crítico aqui
          -- é o inverso do de catalog_events: a coluna nova não pode
          -- VAZAR update/insert para authenticated/anon, porque isso
          -- reabriria a auto-promoção a plano pago via PostgREST — o grant
          -- de authenticated é uma allowlist nominal (20260728110000) e o
          -- select do anon é por coluna (20260709000000), então as colunas
          -- novas já nascem inacessíveis; este guard garante que continuam.
          --
          -- Não checa REFERENCES: essa é a ACL default do schema (Dxtm) já
          -- concedida a todo mundo em toda tabela, mencionada no AGENTS.md —
          -- checá-la aqui só geraria falso positivo. Também não checa SELECT
          -- para authenticated: a tabela já tem GRANT SELECT de nível
          -- tabela para authenticated de antes desta feature (a RLS é quem
          -- restringe à própria loja), então qualquer coluna nova herda
          -- select automaticamente — não é um vazamento novo. anon nunca
          -- teve select de tabela em stores, só por coluna, então SELECT
          -- entra na checagem dele.
          do $$
          declare
            faltando text;
            vazando  text;
          begin
            -- service_role precisa conseguir escrever as cinco colunas
            -- novas (o webhook da Spec 2B vai gravar nelas).
            select string_agg(format('stores.%s:update', col), ', ' order by col)
              into faltando
              from unnest(array[
                'plan_expires_at', 'subscription_status', 'billing_cycle',
                'asaas_customer_id', 'asaas_subscription_id'
              ]) as col
             where not has_column_privilege('service_role', 'public.stores', col, 'update');

            if faltando is not null then
              raise exception 'service_role sem privilegio necessario: %', faltando;
            end if;

            -- anon não pode LER nenhuma das colunas novas.
            select string_agg(format('stores.%s:select (anon)', col), ', ' order by col)
              into vazando
              from unnest(array[
                'plan_expires_at', 'subscription_status', 'billing_cycle',
                'asaas_customer_id', 'asaas_subscription_id'
              ]) as col
             where has_column_privilege('anon', 'public.stores', col, 'select');

            if vazando is not null then
              raise exception 'anon com select nas colunas novas de stores: %', vazando;
            end if;

            -- Nem authenticated nem anon podem ESCREVER nas colunas novas
            -- (só service_role escreve; o webhook da Spec 2B roda com ela).
            select string_agg(
                     format('stores.%s:%s (role=%s)', col, priv, role),
                     ', ' order by role, col, priv)
              into vazando
              from unnest(array[
                     'plan_expires_at', 'subscription_status', 'billing_cycle',
                     'asaas_customer_id', 'asaas_subscription_id'
                   ]) as col
              cross join unnest(array['insert', 'update']) as priv
              cross join unnest(array['authenticated', 'anon']) as role
             where has_column_privilege(role, 'public.stores', col, priv);

            if vazando is not null then
              raise exception 'authenticated/anon com insert/update nas colunas novas de stores: %', vazando;
            end if;

            raise notice 'grants ok: service_role grava colunas de assinatura, authenticated/anon sem select/insert/update nelas';
          end $$;
          SQL

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
